name: Send Telegram Greeting

on:
  schedule:
    # Runs every day at 09:00 UTC — adjust to your timezone (UTC only, no DST)
    - cron: '0 9 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  send-greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send greeting message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_greeting.py
